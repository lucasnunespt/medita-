<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | NeuroMedit</title>
  <link rel="icon" href="assets/neuromedit-symbol-vector.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme-sync.css">
  <link rel="stylesheet" href="settings-panel.css">
  <script src="theme-sync.js"></script>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 255, 255, 0.12), transparent 28%),
        linear-gradient(to bottom, var(--bg, #fbf6eb), var(--bg-soft, #fffdf6));
      color: var(--text, #1f2326);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .settings-demo {
      width: min(88vw, 560px);
      padding: 2rem;
      text-align: center;
    }

    .settings-demo h1 {
      margin: 0 0 0.75rem;
      color: var(--text-primary, var(--text, #1f2326));
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 300;
      line-height: 1;
    }

    .settings-demo p {
      margin: 0 auto 1.5rem;
      max-width: 36rem;
      color: var(--text-secondary, rgba(84, 94, 95, 0.76));
      line-height: 1.65;
    }

    .settings-demo button {
      min-height: 44px;
      padding: 0.8rem 1.25rem;
      border: 1px solid var(--line, rgba(31, 35, 38, 0.08));
      border-radius: 999px;
      background: var(--accent, #8aa5a0);
      color: var(--button-text, #f4e6da);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="settings-demo">
    <h1>Settings</h1>
    <p>Use the floating control to adjust the NeuroMedit experience. Changes are saved on this device and shared with the rest of the prototype.</p>
    <button type="button" onclick="window.NeuroMeditSettings?.apply?.()">Apply current preferences</button>
  </main>

  <script src="settings-panel.js"></script>
</body>
</html>
